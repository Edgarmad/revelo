services:
  wordpress:
    image: wordpress:6.6-php8.2-apache
    ports:
      - "${WORDPRESS_PORT:-8081}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: milapro
      WORDPRESS_DB_USER: milapro
      WORDPRESS_DB_PASSWORD: milapro
      WORDPRESS_DEBUG: "1"
      MILAPRO_REBUILD_WEBHOOK_URL: ${MILAPRO_REBUILD_WEBHOOK_URL:-}
      MILAPRO_REBUILD_WEBHOOK_SECRET: ${MILAPRO_REBUILD_WEBHOOK_SECRET:-}
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/plugins/milapro-headless-cms:/var/www/html/wp-content/plugins/milapro-headless-cms
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: milapro
      MYSQL_USER: milapro
      MYSQL_PASSWORD: milapro
      MYSQL_ROOT_PASSWORD: milapro-root
    volumes:
      - db_data:/var/lib/mysql

  wpcli:
    image: wordpress:cli-php8.2
    user: "33:33"
    profiles:
      - tools
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: milapro
      WORDPRESS_DB_USER: milapro
      WORDPRESS_DB_PASSWORD: milapro
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/plugins/milapro-headless-cms:/var/www/html/wp-content/plugins/milapro-headless-cms
      - ./wordpress/migration:/var/www/html/migration
      - ./public:/var/www/html/migration-public:ro
      - ./src/styles/images:/var/www/html/migration-style-images:ro
    depends_on:
      - db

volumes:
  wordpress_data:
  db_data:
